# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.0"
  python_check_max: "3.15"
  python_min: "3.12"
  # the test fixtures are large, and have weird, sometimes intentionally misbehaved binaries
  run_full_test_suite: false

package:
  name: puremagic
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/puremagic/puremagic-${{ version }}.tar.gz
  sha256: b54e4a69dd37c50bacc879380f132382ab4e9a935529628c8975abcc73e10640

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies
  python:
    entry_points:
      - puremagic = puremagic.main:command_line_entry

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm >=6.2
  run:
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      files:
        - if: run_full_test_suite
          then:
            - etc/conda/test-files/puremagic/**
      site_packages:
        - puremagic/**
        - puremagic-${{ version }}.dist-info/**
  - python:
      imports: puremagic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - puremagic --help
      - puremagic --version
      - puremagic --version | ${{ "grep -iE " if unix else "findstr /r /c:" }}${{ version | replace('.', '\\.') }}
  - if: run_full_test_suite
    then:
      files:
        source:
          - test/
      requirements:
        run:
          - pytest-cov
          - python ${{ python_min }}.*
      script:
        - coverage run --source=puremagic --branch -m pytest -vv --tb=long --color=yes
        - coverage report --show-missing --skip-covered --fail-under=76

about:
  license: MIT
  license_file: LICENSE
  summary: Pure python implementation of magic file detection
  homepage: https://pypi.org/project/puremagic
  repository: https://github.com/cdgriffith/puremagic
  description: |
    Pure python implementation of identifying files based off their magic numbers

extra:
  recipe-maintainers:
    - andreyz4k
    - bollwyvl
